# Превью и WebP для картинок из public/uploads (Liip Imagine).
#
# Как это работает: клиент запрашивает
#   /media/cache/resolve/{filter}/uploads/{папка}/{файл}
# Liip один раз строит вариант (GD), кладёт его в public/media/cache/{filter}/…
# и отвечает редиректом на готовый файл; повторные запросы отдаёт уже статика.
# Оригиналы в public/uploads НЕ меняются — превью и WebP строятся "на лету",
# поэтому старые фото работают сразу, без миграции файлов.
# Готовые URL вариантов backend кладёт в API (imageThumbnail/imageMedium/
# imageWebp — см. App\Entity\Trait\Readable\SingleImageTrait).
liip_imagine:
    driver: gd

    # Базовый резолвер кэша (кладёт файлы в public/media/cache/{filter}/…).
    # Поверх него в config/services.yaml навешен FormatExtensionResolver
    # ("format_extension") — он меняет расширение кэш-файла на формат фильтра
    # (.png -> .webp). Без него WebP-содержимое лежало бы в файле *.png, и
    # nginx/dev-сервер отдавали бы его с неверным Content-Type: image/png.
    resolvers:
        web_path_base:
            web_path:
                web_root: '%kernel.project_dir%/public'
                cache_prefix: media/cache

    # Резолвер по умолчанию для всех фильтров — обёртка с правильным расширением.
    cache: format_extension

    loaders:
        default:
            filesystem:
                data_root: '%kernel.project_dir%/public'

    # Значение по умолчанию для редиректа на готовый файл. Кэшируемость ответа
    # (Cache-Control: immutable) добавляет ImageResolveCacheSubscriber.
    controller:
        redirect_response_code: 302

    filter_sets:
        # Лента, карточки, аватары: длинная сторона 480 px.
        thumb_480:
            quality: 80
            format: webp
            filters:
                auto_rotate: ~        # учесть EXIF-ориентацию фото с телефонов
                downscale:
                    max: [480, 480]   # только уменьшает, маленькие не растягивает

        # Крупное превью: длинная сторона 800 px.
        thumb_800:
            quality: 80
            format: webp
            filters:
                auto_rotate: ~
                downscale:
                    max: [800, 800]

        # Тот же оригинал целиком, но в WebP (для старых тяжёлых PNG/JPEG).
        # Размер ограничен 2400 px по длинной стороне — сверх этого на экране
        # телефона нет смысла.
        webp_full:
            quality: 85
            format: webp
            filters:
                auto_rotate: ~
                downscale:
                    max: [2400, 2400]
